name: E2E Manual Run
run-name: >-
  ${{
    github.event.inputs.skip_tests == 'true'
      && format(
        'Setup: {0} - {1} - {2} - {3} - {4} - {5} - ent: {6}',
        github.event.inputs.setupMethod,
        format(
          'OP v.{0}{1}',
          github.event.inputs.openproject_version != '' && github.event.inputs.openproject_version || '17',
          github.event.inputs.openproject_branch != '' && format(' ({0})', github.event.inputs.openproject_branch) || ''
        ),
        format(
          'NC v.{0}{1}',
          github.event.inputs.nextcloud_version != '' && github.event.inputs.nextcloud_version || '32',
          github.event.inputs.nextcloud_branch != '' && format(' ({0})', github.event.inputs.nextcloud_branch) || ''
        ),
        format(
          'Xwiki v.{0}',
          github.event.inputs.xwiki_version != '' && github.event.inputs.xwiki_version || '17.10.10'
        ),
        github.event.inputs.integration_openproject_branch != '' && format('int ({0})', github.event.inputs.integration_openproject_branch) || (github.event.inputs.integration_openproject_version != '' && format('int v.{0}', github.event.inputs.integration_openproject_version) || 'int default'),
        format(
          'xwiki ext v.{0}',
          github.event.inputs.xwiki_extension_openproject_version != '' && github.event.inputs.xwiki_extension_openproject_version || '1.2.0'
        ),
        github.event.inputs.enterprise_token_tier != '' && github.event.inputs.enterprise_token_tier || 'corporate'
      )
      || format(
        'e2e - {0} - {1} - {2} - {3} - {4} - ent: {5}',
        github.event.inputs.suite,
        github.event.inputs.setupMethod,
        format(
          'op {0}{1}',
          github.event.inputs.openproject_version != '' && github.event.inputs.openproject_version || '17',
          github.event.inputs.openproject_branch != '' && format(' ({0})', github.event.inputs.openproject_branch) || ''
        ),
        format(
          'nc {0}{1}',
          github.event.inputs.nextcloud_version != '' && github.event.inputs.nextcloud_version || '32',
          github.event.inputs.nextcloud_branch != '' && format(' ({0})', github.event.inputs.nextcloud_branch) || ''
        ),
        github.event.inputs.integration_openproject_branch != '' && format('int ({0})', github.event.inputs.integration_openproject_branch) || (github.event.inputs.integration_openproject_version != '' && format('int v.{0}', github.event.inputs.integration_openproject_version) || 'int default'),
        github.event.inputs.enterprise_token_tier != '' && github.event.inputs.enterprise_token_tier || 'corporate'
      )
  }}

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Deploy only"
        required: false
        default: false
        type: boolean
      suite:
        description: "Test suite"
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression
          - integration
          - mcp
          - custom
      custom_grep:
        description: "Custom --grep expression"
        required: false
        type: string
      squash_iteration_id:
        description: "Squash TM iteration ID for result import"
        required: false
        type: string
      squash_sync_test_plan:
        description: "Fill iteration with test cases"
        required: false
        default: false
        type: boolean
      setupMethod:
        description: "Integration setup mode"
        required: true
        default: sso-external
        type: choice
        options:
          - sso-external
          - sso-nextcloud
          - oauth2
      openproject_version:
        description: "OpenProject image tag (empty = 17)"
        required: false
        type: string
      openproject_branch:
        description: "Optional OpenProject git source branch"
        required: false
        type: string
      nextcloud_version:
        description: "Nextcloud image tag (empty = 32)"
        required: false
        type: string
      nextcloud_branch:
        description: "Optional Nextcloud git source branch override"
        required: false
        type: string
      integration_openproject_version:
        description: "integration_openproject app version"
        required: false
        type: string
      integration_openproject_branch:
        description: "integration_openproject git branch override"
        required: false
        type: string
      xwiki_version:
        description: "XWiki image tag"
        required: false
        default: "17.10.10"
        type: string
      xwiki_extension_openproject_version:
        description: "XWiki openproject extension version"
        required: false
        default: "1.2.0"
        type: string
      wiki_enhancements:
        description: "Enable OpenProject wiki_enhancements feature flag (XWiki)"
        required: false
        default: true
        type: boolean
      enterprise_token_tier:
        description: "OpenProject enterprise plan (integration stack requires corporate)"
        required: true
        default: corporate
        type: choice
        options:
          - corporate

permissions:
  contents: read

jobs:
  resolve_playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve Playwright version from lockfile
        id: version
        run: |
          set -euo pipefail
          version="$(e2e/scripts/playwright-version.sh)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Playwright version: ${version}"
          {
            echo "### Playwright version"
            echo ""
            echo "Lockfile \`@playwright/test\`: \`${version}\`"
            echo "CI image: \`mcr.microsoft.com/playwright:v${version}-noble\`"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  # Batched OP/NC/IO/XWiki pin validation (not one job per product).
  # Playwright stays a separate prior job only because container.image must bind from needs.*.outputs.
  resolve_deploy_inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      openproject_version: ${{ steps.validate.outputs.openproject_version }}
      openproject_branch: ${{ steps.validate.outputs.openproject_branch }}
      nextcloud_version: ${{ steps.validate.outputs.nextcloud_version }}
      nextcloud_branch: ${{ steps.validate.outputs.nextcloud_branch }}
      integration_openproject_version: ${{ steps.validate.outputs.integration_openproject_version }}
      integration_openproject_branch: ${{ steps.validate.outputs.integration_openproject_branch }}
      effective_xwiki_version: ${{ steps.validate.outputs.effective_xwiki_version }}
      effective_xwiki_extension_version: ${{ steps.validate.outputs.effective_xwiki_extension_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate and resolve deploy inputs
        id: validate
        env:
          IN_OP_VER: ${{ github.event.inputs.openproject_version }}
          IN_NC_VER: ${{ github.event.inputs.nextcloud_version }}
          IN_XWIKI_VER: ${{ github.event.inputs.xwiki_version }}
          IN_IO_VER: ${{ github.event.inputs.integration_openproject_version }}
          IN_XWIKI_EXT: ${{ github.event.inputs.xwiki_extension_openproject_version }}
          IN_OP_BRANCH: ${{ github.event.inputs.openproject_branch }}
          IN_NC_BRANCH: ${{ github.event.inputs.nextcloud_branch }}
          IN_IO_BRANCH: ${{ github.event.inputs.integration_openproject_branch }}
        run: .github/scripts/validate-deploy-inputs.sh

  deploy:
    needs: [resolve_playwright, resolve_deploy_inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true
      HEADLESS: true
      SKIP_SETUP_JOB_CHECK: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HETZNER_CA_KEY: ${{ secrets.HETZNER_CA_KEY }}
    outputs:
      live: ${{ steps.publish.outputs.live }}
      preview_name: ${{ steps.publish.outputs.preview_name }}
      grep_b64: ${{ steps.publish.outputs.grep_b64 }}
      tests_should_run: ${{ steps.publish.outputs.tests_should_run }}
      openproject_host: ${{ steps.publish.outputs.openproject_host }}
      openproject_url: ${{ steps.publish.outputs.openproject_url }}
      nextcloud_host: ${{ steps.publish.outputs.nextcloud_host }}
      keycloak_host: ${{ steps.publish.outputs.keycloak_host }}
      xwiki_host: ${{ steps.publish.outputs.xwiki_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve enterprise token
        id: enterprise_token
        env:
          ENTERPRISE_TOKEN_TIER: ${{ github.event.inputs.enterprise_token_tier }}
          TOKEN_CORPORATE: ${{ secrets.OPENPROJECT_ENTERPRISE_TOKEN }}
        run: .github/scripts/resolve-enterprise-token.sh

      - name: Record run start time (Europe/Berlin)
        env:
          IN_TIER: ${{ github.event.inputs.enterprise_token_tier }}
        run: |
          set -euo pipefail
          ts="$(TZ=Europe/Berlin date '+%d %b %Y %H:%M:%S')"
          {
            echo "### E2E manual run (deploy)"
            echo ""
            echo "**Started (Europe/Berlin):** ${ts}"
            echo "**Enterprise token tier:** ${IN_TIER:-corporate}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::E2E deploy started (Europe/Berlin): ${ts}"

      - name: Resolve grep and preview name
        id: resolve
        env:
          IN_SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
          IN_SUITE: ${{ github.event.inputs.suite }}
          IN_SETUP: ${{ github.event.inputs.setupMethod }}
          IN_CUSTOM_GREP: ${{ github.event.inputs.custom_grep }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SECRET_HCLOUD: ${{ secrets.HCLOUD_TOKEN }}
          SECRET_HETZNER_CA: ${{ secrets.HETZNER_CA_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SECRET_HCLOUD:-}" ]]; then
            echo "::error::Secret HCLOUD_TOKEN is not set or empty."
            exit 1
          fi
          if [[ -z "${SECRET_HETZNER_CA:-}" ]]; then
            echo "::error::Secret HETZNER_CA_KEY is not set or empty."
            exit 1
          fi

          grep=""
          if [[ "${IN_SKIP_TESTS}" != "true" ]]; then
            case "${IN_SUITE}" in
              all) grep='' ;;
              smoke) grep='@smoke' ;;
              regression) grep='@regression' ;;
              integration) grep='@integration' ;;
              mcp) grep='@mcp' ;;
              custom) grep="${IN_CUSTOM_GREP}" ;;
              *)
                echo "::error::Unknown suite: ${IN_SUITE}"
                exit 1
                ;;
            esac

            if [ "${IN_SUITE}" = "custom" ] && [ -z "${grep}" ]; then
              echo "::error::Resolved grep is empty. For suite=custom, set custom_grep."
              exit 1
            fi
          fi

          preview_prefix="e2e"
          if [[ "${IN_SKIP_TESTS}" == "true" ]]; then
            preview_prefix="setup"
          fi
          preview_name="${preview_prefix}-${RUN_ID}-${RUN_ATTEMPT}"

          # Heredoc-delimited outputs guard against newlines/special chars in
          # user-provided inputs (e.g. custom_grep or preview_name).
          delim="EOF_$(openssl rand -hex 8)"
          {
            printf 'grep<<%s\n%s\n%s\n' "${delim}" "${grep}" "${delim}"
            printf 'preview_name<<%s\n%s\n%s\n' "${delim}" "${preview_name}" "${delim}"
            .github/scripts/resolve-stack-topology.sh "${IN_SUITE}" "${IN_SETUP}"
          } >> "$GITHUB_OUTPUT"

      - name: PullPreview up
        id: pullpreview_up
        if: success()
        uses: pullpreview/action@65df5209b58f360444525f1167f9e14803521fed # v0.6.2
        with:
          provider: hetzner
          label: ${{ steps.resolve.outputs.preview_name }}
          force_action: up
          region: fsn1
          image: ubuntu-24.04
          instance_type: cpx42
          dns: my.opf.run
          max_domain_length: "40"
          deployment_target: helm
          chart: ./charts/pullpreview-stack
          chart_values: pullpreview/stack-values.yaml.gotmpl
          pre_script: pullpreview/pre-script-helm-deps-e2e.sh
          proxy_tls: traefik:80
          proxy_tls_hosts: ${{ steps.resolve.outputs.proxy_tls_hosts }}
          ttl: ${{ github.event.inputs.skip_tests == 'true' && '72h' || '24h' }}
        env:
          PULLPREVIEW_LOGGER_LEVEL: ERROR
          OPENPROJECT_ENTERPRISE_TOKEN: ${{ steps.enterprise_token.outputs.token }}
          INTEGRATION_SETUP_METHOD: ${{ github.event.inputs.setupMethod }}
          OPENPROJECT_VERSION: ${{ github.event.inputs.openproject_version }}
          OPENPROJECT_BRANCH: ${{ github.event.inputs.openproject_branch }}
          NEXTCLOUD_VERSION: ${{ github.event.inputs.nextcloud_version }}
          NEXTCLOUD_BRANCH: ${{ github.event.inputs.nextcloud_branch }}
          INTEGRATION_OPENPROJECT_VERSION: ${{ needs.resolve_deploy_inputs.outputs.integration_openproject_version }}
          INTEGRATION_OPENPROJECT_GIT_BRANCH: ${{ needs.resolve_deploy_inputs.outputs.integration_openproject_branch }}
          XWIKI_VERSION: ${{ needs.resolve_deploy_inputs.outputs.effective_xwiki_version }}
          XWIKI_EXTENSION_OPENPROJECT_VERSION: ${{ needs.resolve_deploy_inputs.outputs.effective_xwiki_extension_version }}
          OPENPROJECT_FEATURE_WIKI_ENHANCEMENTS: ${{ github.event.inputs.wiki_enhancements }}
          XWIKI_ENABLED: ${{ steps.resolve.outputs.xwiki_enabled }}
          STACK_PROFILE: ${{ steps.resolve.outputs.stack_profile }}

      - name: Strip SSH lines from PullPreview summary
        if: >-
          always() &&
          steps.pullpreview_up.outcome != 'skipped' &&
          github.event.inputs.skip_tests != 'true'
        run: |
          set -euo pipefail
          [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || exit 0
          [[ -f "${GITHUB_STEP_SUMMARY}" ]] || exit 0
          # Do not use `grep -v`: GNU grep exits 1 when no lines are emitted (empty file / no matches), which breaks `set -e`.
          sed -i -E '/^- SSH (Username|IP|Command):/d' "${GITHUB_STEP_SUMMARY}"

      - name: Deploy preview summary
        if: always() && steps.pullpreview_up.outcome != 'skipped'
        env:
          PREVIEW_NAME: ${{ steps.resolve.outputs.preview_name }}
          PULLPREVIEW_OUTCOME: ${{ steps.pullpreview_up.outcome }}
          PULLPREVIEW_LIVE: ${{ steps.pullpreview_up.outputs.live }}
          PREVIEW_URL: ${{ steps.pullpreview_up.outputs.url }}
          IN_SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
          SKIP_NEXTCLOUD: ${{ steps.resolve.outputs.skip_nextcloud }}
          SKIP_XWIKI: ${{ steps.resolve.outputs.skip_xwiki }}
          SKIP_KEYCLOAK: ${{ steps.resolve.outputs.skip_keycloak }}
        run: .github/scripts/deploy-preview-summary.sh

      - name: Preview endpoint checks
        id: validate_urls
        uses: ./.github/actions/preview-endpoint-checks
        if: success() && steps.pullpreview_up.outputs.live == 'true'
        continue-on-error: true
        with:
          preview-url: ${{ steps.pullpreview_up.outputs.url }}
          skip-xwiki: ${{ steps.resolve.outputs.skip_xwiki }}
          skip-nextcloud: ${{ steps.resolve.outputs.skip_nextcloud }}
          skip-keycloak: ${{ steps.resolve.outputs.skip_keycloak }}

      - name: Diagnostics (on URL validation failure)
        if: always() && steps.pullpreview_up.outputs.live == 'true' && steps.validate_urls.outcome != 'success'
        env:
          PREVIEW_URL: ${{ steps.pullpreview_up.outputs.url }}
          SKIP_XWIKI: ${{ steps.resolve.outputs.skip_xwiki }}
          IN_SUITE: ${{ github.event.inputs.suite }}
        run: |
          set -euo pipefail
          preview_host="$(.github/scripts/preview-parse-host.sh)"

          dump() {
            local url="$1"
            local status=""
            local curl_exit=0
            echo "::group::Diagnostics: ${url}"
            set +e
            # Keep stderr: -S prints the TLS/connect reason (curl 35, etc.).
            status="$(
              /usr/bin/curl -skS -o /dev/null \
                --connect-timeout 10 \
                --write-out '%{http_code}' \
                "${url}"
            )"
            curl_exit=$?
            set -e
            if [[ "${curl_exit}" -eq 0 ]]; then
              echo "HTTP status: ${status}"
            else
              echo "curl exit: ${curl_exit} HTTP status: ${status}"
            fi
            echo "::endgroup::"
          }

          dump "https://${preview_host}/"
          if [[ "${IN_SUITE}" == "mcp" ]]; then
            dump "https://${preview_host}/mcp"
          fi

          if [[ "${SKIP_XWIKI}" != "true" ]]; then
            dump "https://xwiki.${preview_host}/"
            dump "https://xwiki.${preview_host}/bin/distribution/XWiki/Distribution"
            dump "https://xwiki.${preview_host}/bin/view/Main/"
            dump "https://xwiki.${preview_host}/rest/openproject/metadata"
            dump "https://xwiki.${preview_host}/rest/wikis/xwiki"
          fi

      - name: Export hosts for Playwright
        id: export_hosts
        if: success() && steps.pullpreview_up.outputs.live == 'true' && steps.validate_urls.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.pullpreview_up.outputs.url }}
          PREVIEW_NAME: ${{ steps.resolve.outputs.preview_name }}
          SKIP_NEXTCLOUD: ${{ steps.resolve.outputs.skip_nextcloud }}
          SKIP_XWIKI: ${{ steps.resolve.outputs.skip_xwiki }}
          SKIP_KEYCLOAK: ${{ steps.resolve.outputs.skip_keycloak }}
        run: |
          set -euo pipefail
          preview_url="${PREVIEW_URL}"
          preview_host="$(.github/scripts/preview-parse-host.sh)"

          if [[ "${preview_url}" == *:443 ]]; then
            preview_url="${preview_url%:443}"
          fi

          {
            echo "OPENPROJECT_HOST=${preview_host}"
            echo "OPENPROJECT_URL=${preview_url}"
            echo "E2E_ENV=pullpreview"
          } >> "$GITHUB_ENV"
          if [[ "${SKIP_NEXTCLOUD:-false}" != "true" ]]; then
            echo "NEXTCLOUD_HOST=nextcloud.${preview_host}" >> "$GITHUB_ENV"
          fi
          if [[ "${SKIP_KEYCLOAK:-false}" != "true" ]]; then
            echo "KEYCLOAK_HOST=keycloak.${preview_host}" >> "$GITHUB_ENV"
          fi
          if [[ "${SKIP_XWIKI:-false}" != "true" ]]; then
            echo "XWIKI_HOST=xwiki.${preview_host}" >> "$GITHUB_ENV"
          fi

          {
            echo "### PullPreview endpoints"
            echo ""
            echo "- Preview name: \`${PREVIEW_NAME}\`"
            echo "- OpenProject: ${preview_url}"
            if [[ "${SKIP_NEXTCLOUD:-false}" != "true" ]]; then
              echo "- Nextcloud: https://nextcloud.${preview_host}"
            fi
            if [[ "${SKIP_KEYCLOAK:-false}" != "true" ]]; then
              echo "- Keycloak: https://keycloak.${preview_host}"
            fi
            if [[ "${SKIP_XWIKI:-false}" != "true" ]]; then
              echo "- XWiki: https://xwiki.${preview_host}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deploy outputs
        id: publish
        if: always()
        env:
          LIVE: ${{ steps.pullpreview_up.outputs.live }}
          PREVIEW_NAME: ${{ steps.resolve.outputs.preview_name }}
          GREP: ${{ steps.resolve.outputs.grep }}
          VALIDATE_OUTCOME: ${{ steps.validate_urls.outcome }}
          IN_SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
        run: |
          set -euo pipefail
          tests_should_run=false
          if [[ "${IN_SKIP_TESTS}" != "true" ]] && [[ "${LIVE}" == "true" ]] && [[ "${VALIDATE_OUTCOME}" == "success" ]]; then
            tests_should_run=true
          fi
          grep_b64="$(printf '%s' "${GREP}" | base64 -w0)"
          {
            echo "live=${LIVE:-}"
            echo "preview_name=${PREVIEW_NAME}"
            echo "grep_b64=${grep_b64}"
            echo "tests_should_run=${tests_should_run}"
            echo "openproject_host=${OPENPROJECT_HOST:-}"
            echo "openproject_url=${OPENPROJECT_URL:-}"
            echo "nextcloud_host=${NEXTCLOUD_HOST:-}"
            echo "keycloak_host=${KEYCLOAK_HOST:-}"
            echo "xwiki_host=${XWIKI_HOST:-}"
          } >> "$GITHUB_OUTPUT"

  running_tests:
    needs: [deploy, resolve_playwright]
    if: always() && needs.resolve_playwright.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve_playwright.outputs.version }}-noble
    timeout-minutes: 90
    env:
      CI: true
      HEADLESS: true
      SKIP_SETUP_JOB_CHECK: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_IMAGE_VERSION: ${{ needs.resolve_playwright.outputs.version }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HETZNER_CA_KEY: ${{ secrets.HETZNER_CA_KEY }}
      OPENPROJECT_HOST: ${{ needs.deploy.outputs.openproject_host }}
      NEXTCLOUD_HOST: ${{ needs.deploy.outputs.nextcloud_host }}
      KEYCLOAK_HOST: ${{ needs.deploy.outputs.keycloak_host }}
      XWIKI_HOST: ${{ needs.deploy.outputs.xwiki_host }}
      OPENPROJECT_URL: ${{ needs.deploy.outputs.openproject_url }}
      E2E_ENV: pullpreview
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Record test phase start
        if: needs.deploy.outputs.tests_should_run == 'true'
        run: |
          set -euo pipefail
          {
            echo "### E2E manual run (tests)"
            echo ""
            echo "**Deploy job:** ${{ needs.deploy.result }} | live=${{ needs.deploy.outputs.live }} | tests_should_run=${{ needs.deploy.outputs.tests_should_run }}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install dependencies
        if: needs.deploy.outputs.tests_should_run == 'true'
        working-directory: e2e
        run: npm ci

      - name: Verify Playwright browser availability
        if: needs.deploy.outputs.tests_should_run == 'true'
        working-directory: e2e
        run: |
          set -euo pipefail
          installed_version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          expected_version="${PLAYWRIGHT_IMAGE_VERSION#v}"
          if [[ "${installed_version}" != "${expected_version}" ]]; then
            echo "::error::@playwright/test ${installed_version} does not match Playwright image version ${expected_version} (from package-lock). Check npm ci / lockfile integrity."
            exit 1
          fi
          npx playwright --version
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run Playwright tests
        id: tests
        if: needs.deploy.outputs.tests_should_run == 'true'
        continue-on-error: true
        working-directory: e2e
        env:
          SETUP_METHOD: ${{ github.event.inputs.setupMethod }}
          TAG_GREP_B64: ${{ needs.deploy.outputs.grep_b64 }}
        run: |
          set -uo pipefail
          TAG_GREP=""
          if [[ -n "${TAG_GREP_B64:-}" ]]; then
            TAG_GREP="$(printf '%s' "${TAG_GREP_B64}" | base64 -d)"
          fi
          args=(npx playwright test)
          if [ -n "${TAG_GREP:-}" ]; then
            args+=(--grep "${TAG_GREP}")
          fi
          echo "Running: ${args[*]}"
          echo "Hosts: OP=${OPENPROJECT_HOST} NC=${NEXTCLOUD_HOST} KC=${KEYCLOAK_HOST} XW=${XWIKI_HOST}"
          _test_start=$(date +%s)
          set +e
          "${args[@]}"
          _test_status=$?
          set -e
          echo "TIMING_TESTS=$(( $(date +%s) - _test_start ))" >> "$GITHUB_ENV"
          exit "${_test_status}"

      - name: Publish Playwright results to Squash TM
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        working-directory: e2e
        env:
          SQUASH_TM_API_TOKEN: ${{ secrets.SQUASH_TM_API_TOKEN }}
          SQUASH_TM_ITERATION_ID: ${{ github.event.inputs.squash_iteration_id != '' && github.event.inputs.squash_iteration_id || vars.SQUASH_TM_ITERATION_ID }}
          SQUASH_TM_SYNC_TEST_PLAN: ${{ github.event.inputs.squash_sync_test_plan == 'true' && 'true' || 'false' }}
          SQUASH_TM_IMPORT_STEPS: "true"
          SQUASH_TM_VALIDATE_STEP_COUNT: "true"
          SQUASH_TM_SKIP_MISSING_AUTH: "true"
        run: |
          _sq_start=$(date +%s)
          npm run squash:publish
          echo "TIMING_SQUASH=$(( $(date +%s) - _sq_start ))" >> "$GITHUB_ENV"

      - name: Upload Squash TM payload
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: squash-results
          path: e2e/playwright-report/**/squash-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Add detected versions and workflow inputs to summary
        if: always() && needs.deploy.outputs.live == 'true'
        working-directory: e2e
        env:
          IN_OP_BRANCH: ${{ github.event.inputs.openproject_branch }}
          IN_NC_BRANCH: ${{ github.event.inputs.nextcloud_branch }}
          IN_IO_BRANCH: ${{ github.event.inputs.integration_openproject_branch }}
          IN_IO_VER: ${{ github.event.inputs.integration_openproject_version }}
          IN_OP_VER: ${{ github.event.inputs.openproject_version }}
          IN_NC_VER: ${{ github.event.inputs.nextcloud_version }}
          IN_XWIKI_VER: ${{ github.event.inputs.xwiki_version }}
          IN_XWIKI_EXT: ${{ github.event.inputs.xwiki_extension_openproject_version }}
        run: |
          set -euo pipefail

          json="test-results/e2e-env.json"
          if [[ ! -f "${json}" ]]; then
            echo "::warning::Version file not found at ${json}; skipping detected versions in summary."
          fi

          get() {
            node -e "const d=JSON.parse(require('fs').readFileSync('${json}','utf8'));console.log(d[process.argv[1]]||'not-detected')" "$1"
          }

          {
            echo "### Versions"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ -f "${json}" ]]; then
            op="$(get OPENPROJECT_VERSION)"
            nc="$(get NEXTCLOUD_VERSION)"
            nc_api="$(get NEXTCLOUD_API_VERSION)"
            integration_app="$(get INTEGRATION_APP_VERSION)"
            team_folders="$(get NEXTCLOUD_TEAM_FOLDERS_VERSION)"
            keycloak="$(get KEYCLOAK_VERSION)"
            {
              printf '%s\n' "- OpenProject (detected): \`${op}\`"
              printf '%s\n' "- Nextcloud (detected): \`${nc}\`"
              printf '%s\n' "- Nextcloud API: \`${nc_api}\`"
              printf '%s\n' "- Integration app (integration_openproject): \`${integration_app}\`"
              printf '%s\n' "- Team Folders: \`${team_folders}\`"
              printf '%s\n' "- Keycloak: \`${keycloak}\`"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          {
            echo "#### Workflow inputs (image / source)"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ -n "${IN_OP_VER:-}" ]]; then
            echo "- OpenProject image tag: \`${IN_OP_VER}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IN_OP_BRANCH:-}" ]]; then
            echo "- OpenProject git source branch: \`${IN_OP_BRANCH}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IN_NC_VER:-}" ]]; then
            echo "- Nextcloud image tag: \`${IN_NC_VER}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IN_NC_BRANCH:-}" ]]; then
            echo "- Nextcloud git source branch: \`${IN_NC_BRANCH}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IN_IO_VER:-}" ]]; then
            echo "- integration_openproject app version (workflow input): \`${IN_IO_VER}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IN_IO_BRANCH:-}" ]]; then
            echo "- integration_openproject git branch: \`${IN_IO_BRANCH}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IN_XWIKI_VER:-}" ]]; then
            echo "- XWiki image tag: \`${IN_XWIKI_VER}\`" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "- XWiki image tag: \`17.10.10\` (default when empty)" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IN_XWIKI_EXT:-}" ]]; then
            echo "- XWiki OpenProject extension version: \`${IN_XWIKI_EXT}\`" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "- XWiki OpenProject extension version: \`1.2.0\` (default when empty)" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "" >> "${GITHUB_STEP_SUMMARY}"

      - name: Compute teardown policy
        id: policy
        if: always()
        env:
          LIVE: ${{ needs.deploy.outputs.live }}
          PREVIEW_NAME: ${{ needs.deploy.outputs.preview_name }}
          TESTS_SHOULD_RUN: ${{ needs.deploy.outputs.tests_should_run }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
        run: |
          set -euo pipefail
          outcome="${TESTS_OUTCOME:-skipped}"
          if [[ "${TESTS_SHOULD_RUN}" != "true" ]]; then
            outcome="skipped"
          fi
          should_teardown=false
          if [[ -z "${PREVIEW_NAME:-}" ]]; then
            echo "should_teardown=false" >> "$GITHUB_OUTPUT"
            echo "tests_effective_outcome=${outcome}" >> "$GITHUB_OUTPUT"
            echo "No preview label (deploy did not publish outputs); skip teardown."
            exit 0
          fi
          if [[ "${SKIP_TESTS}" == "true" ]] && [[ "${LIVE}" == "true" ]]; then
            should_teardown=false
          elif [[ "${LIVE}" != "true" ]]; then
            should_teardown=true
          elif [[ "${TESTS_SHOULD_RUN}" == "true" ]] && [[ "${outcome}" == "success" ]]; then
            should_teardown=true
          elif [[ "${TESTS_SHOULD_RUN}" == "true" ]] && [[ "${outcome}" != "success" ]]; then
            should_teardown=false
          elif [[ "${LIVE}" == "true" ]] && [[ "${TESTS_SHOULD_RUN}" != "true" ]]; then
            # URL validation / host export failed: keep the preview (same as a Playwright failure).
            should_teardown=false
          fi
          echo "should_teardown=${should_teardown}" >> "$GITHUB_OUTPUT"
          echo "tests_effective_outcome=${outcome}" >> "$GITHUB_OUTPUT"
          echo "Computed: live=${LIVE} skip_tests=${SKIP_TESTS} tests_should_run=${TESTS_SHOULD_RUN} effective_outcome=${outcome} -> should_teardown=${should_teardown}"

      - name: Trigger PullPreview teardown
        if: >-
          always() &&
          steps.policy.outputs.should_teardown == 'true' &&
          needs.deploy.outputs.preview_name != ''
        uses: pullpreview/action@65df5209b58f360444525f1167f9e14803521fed # v0.6.2
        with:
          provider: hetzner
          label: ${{ needs.deploy.outputs.preview_name }}
          force_action: down
          deployment_target: helm
        env:
          PULLPREVIEW_LOGGER_LEVEL: ERROR

      - name: Keep environment notice
        if: >-
          always() &&
          needs.deploy.outputs.live == 'true' &&
          needs.deploy.outputs.preview_name != '' &&
          steps.policy.outputs.should_teardown == 'false' &&
          (github.event.inputs.skip_tests == 'true' || needs.deploy.outputs.tests_should_run != 'true' || steps.tests.outcome == 'failure')
        env:
          PREVIEW_NAME: ${{ needs.deploy.outputs.preview_name }}
          OPENPROJECT_URL: ${{ needs.deploy.outputs.openproject_url }}
          NEXTCLOUD_HOST: ${{ needs.deploy.outputs.nextcloud_host }}
          KEYCLOAK_HOST: ${{ needs.deploy.outputs.keycloak_host }}
          XWIKI_HOST: ${{ needs.deploy.outputs.xwiki_host }}
          SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
          TESTS_SHOULD_RUN: ${{ needs.deploy.outputs.tests_should_run }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_TESTS}" == "true" ]]; then
            cleanup_target="setup"
            reason="Setup-only deploy (skip_tests)."
          elif [[ "${TESTS_SHOULD_RUN}" != "true" ]]; then
            cleanup_target="e2e"
            reason="URL validation failed; preview kept for 24h (TTL), then auto-expires."
          else
            cleanup_target="e2e"
            reason="Playwright tests failed; preview kept for 24h (TTL), then auto-expires."
          fi
          {
            echo "### PullPreview environment kept"
            echo ""
            echo "${reason}"
            echo ""
            echo "- Preview label: \`${PREVIEW_NAME}\`"
            if [[ -n "${OPENPROJECT_URL}" ]]; then
              echo "- OpenProject: ${OPENPROJECT_URL}"
            fi
            if [[ -n "${NEXTCLOUD_HOST}" ]]; then
              echo "- Nextcloud: https://${NEXTCLOUD_HOST}"
            fi
            if [[ -n "${KEYCLOAK_HOST}" ]]; then
              echo "- Keycloak: https://${KEYCLOAK_HOST}"
            fi
            if [[ -n "${XWIKI_HOST}" ]]; then
              echo "- XWiki: https://${XWIKI_HOST}"
            fi
            echo ""
            echo "To tear down later, run workflow **PullPreview Cleanup**:"
            echo "- \`target=${cleanup_target}\`"
            echo "- \`mode=teardown\`"
            echo "- \`confirm_teardown=true\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always() && needs.deploy.outputs.live == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload e2e test results (incl. e2e-env.json)
        if: always() && needs.deploy.outputs.live == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Test phase timing summary
        if: always() && needs.deploy.outputs.live == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Test phase timings"
            echo ""
            echo "| Phase | Seconds |"
            echo "|---|---|"
            echo "| Playwright run | ${TIMING_TESTS:-n/a} |"
            echo "| Squash publish | ${TIMING_SQUASH:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final status
        if: always()
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PREVIEW_LIVE: ${{ needs.deploy.outputs.live }}
          TESTS_SHOULD_RUN: ${{ needs.deploy.outputs.tests_should_run }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
        run: |
          set -euo pipefail
          if [[ "${PREVIEW_LIVE}" != "true" ]]; then
            if [[ "${DEPLOY_RESULT}" == "failure" ]]; then
              echo "::error::Deploy job failed before the preview was ready; see the **deploy** job logs."
            else
              echo "::error::PullPreview did not become live."
            fi
            exit 1
          fi
          if [[ "${SKIP_TESTS}" == "true" ]]; then
            if [[ "${DEPLOY_RESULT}" != "success" ]]; then
              echo "::error::Setup-only deploy did not complete successfully; see the **deploy** job logs."
              exit 1
            fi
            echo "::notice::Setup-only deploy is live. Tear down via **PullPreview Cleanup** (target=setup)."
            exit 0
          fi
          if [[ "${TESTS_SHOULD_RUN}" != "true" ]]; then
            echo "::error::Preview was live but URL validation or host export did not complete; tests were not run. Preview kept for debugging; tear down via **PullPreview Cleanup** (target=e2e)."
            exit 1
          fi
          case "${TESTS_OUTCOME}" in
            success) exit 0 ;;
            failure)
              echo "::error::Playwright tests failed. Preview kept for debugging; tear down via **PullPreview Cleanup** (target=e2e)."
              exit 1
              ;;
            skipped)
              echo "::error::Playwright tests did not run (earlier step failed or was skipped)."
              exit 1
              ;;
            *)
              echo "::error::Unexpected Playwright step outcome: ${TESTS_OUTCOME}"
              exit 1
              ;;
          esac
