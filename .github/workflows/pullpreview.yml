name: PullPreview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pullpreview-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.label.name == 'pullpreview' || contains(github.event.pull_request.labels.*.name, 'pullpreview')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: component_label_change
        shell: bash
        run: |
          set -euo pipefail

          action="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"
          label="$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")"
          has_pullpreview="$(jq -r '[.pull_request.labels[]?.name] | index("pullpreview") != null' "$GITHUB_EVENT_PATH")"

          component_label_changed=false
          if [[ "$has_pullpreview" == "true" && ( "$action" == "labeled" || "$action" == "unlabeled" ) ]]; then
            case "$label" in
              auth-sso-external|auth-sso-nextcloud|auth-oauth2|with-xwiki|with-gitlab)
                component_label_changed=true
                ;;
            esac
          fi

          {
            echo "changed=${component_label_changed}"
            if [[ "$component_label_changed" == "true" ]]; then
              echo "force_action=up"
            else
              echo "force_action="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Resolve setup method and components
        id: resolve_setup_method
        shell: bash
        run: |
          set -euo pipefail
          setup_method="sso-external"
          xwiki="false"
          gitlab="false"

          labels="$(jq -r '[.pull_request.labels[]?.name] | join(" ")' "$GITHUB_EVENT_PATH")"
          auth_set=false
          for label in $labels; do
            case "$label" in
              auth-sso-nextcloud)
                if [[ "${auth_set}" != "true" ]]; then setup_method="sso-nextcloud"; auth_set=true; fi
                ;;
              auth-oauth2)
                if [[ "${auth_set}" != "true" ]]; then setup_method="oauth2"; auth_set=true; fi
                ;;
              auth-sso-external)
                if [[ "${auth_set}" != "true" ]]; then setup_method="sso-external"; auth_set=true; fi
                ;;
              with-xwiki)  xwiki="true" ;;
              with-gitlab) gitlab="true" ;;
            esac
          done

          {
            echo "method=${setup_method}"
            IN_XWIKI_ENABLED="${xwiki}" IN_GITLAB_ENABLED="${gitlab}" \
              .github/scripts/resolve-stack-topology.sh "" "${setup_method}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::PullPreview setup method: ${setup_method}; xwiki=${xwiki}; gitlab=${gitlab}"

      - name: Resolve enterprise token
        id: enterprise_token
        env:
          ENTERPRISE_TOKEN_TIER: corporate
          TOKEN_CORPORATE: ${{ secrets.OPENPROJECT_ENTERPRISE_TOKEN }}
        run: .github/scripts/resolve-enterprise-token.sh

      - name: Recreate preview before component change
        if: steps.component_label_change.outputs.changed == 'true'
        uses: pullpreview/action@65df5209b58f360444525f1167f9e14803521fed # poc/pullpreview-helm-multihost (pullpreview/action#133)
        with:
          provider: hetzner
          label: pullpreview
          force_action: down
          deployment_target: helm
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_CA_KEY: ${{ secrets.HETZNER_CA_KEY }}
          PULLPREVIEW_LOGGER_LEVEL: ERROR

      - id: pullpreview
        uses: pullpreview/action@65df5209b58f360444525f1167f9e14803521fed # poc/pullpreview-helm-multihost (pullpreview/action#133)
        with:
          provider: hetzner
          label: pullpreview
          force_action: ${{ steps.component_label_change.outputs.force_action }}
          region: fsn1
          image: ubuntu-24.04
          instance_type: cpx42
          dns: my.opf.run
          max_domain_length: "40"
          deployment_target: helm
          chart: ./charts/pullpreview-stack
          chart_values: pullpreview/stack-values.yaml.gotmpl
          pre_script: pullpreview/pre-script-helm-deps.sh
          proxy_tls: traefik:80
          proxy_tls_hosts: ${{ steps.resolve_setup_method.outputs.proxy_tls_hosts }}
          ttl: 72h
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_CA_KEY: ${{ secrets.HETZNER_CA_KEY }}
          OPENPROJECT_ENTERPRISE_TOKEN: ${{ steps.enterprise_token.outputs.token }}
          INTEGRATION_SETUP_METHOD: ${{ steps.resolve_setup_method.outputs.method }}
          XWIKI_ENABLED: ${{ steps.resolve_setup_method.outputs.xwiki_enabled }}
          GITLAB_ENABLED: ${{ steps.resolve_setup_method.outputs.gitlab_enabled }}
          GITLAB_VERSION: ""
          PULLPREVIEW_LOGGER_LEVEL: INFO

      - name: Require live preview
        if: >-
          github.event.action != 'closed' &&
          contains(github.event.pull_request.labels.*.name, 'pullpreview')
        env:
          LIVE: ${{ steps.pullpreview.outputs.live }}
          PREVIEW_URL: ${{ steps.pullpreview.outputs.url }}
        run: |
          set -euo pipefail
          if [[ "${LIVE}" != "true" ]] || [[ -z "${PREVIEW_URL:-}" ]]; then
            echo "::error::PullPreview did not become live."
            exit 1
          fi

      - name: Strip SSH lines from PullPreview summary
        if: always() && steps.pullpreview.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || exit 0
          [[ -f "${GITHUB_STEP_SUMMARY}" ]] || exit 0
          sed -i -E '/^- SSH (Username|IP|Command):/d' "${GITHUB_STEP_SUMMARY}"

      - name: Deploy preview summary
        if: always() && steps.pullpreview.outcome != 'skipped'
        env:
          PREVIEW_NAME: pullpreview
          PULLPREVIEW_OUTCOME: ${{ steps.pullpreview.outcome }}
          PULLPREVIEW_LIVE: ${{ steps.pullpreview.outputs.live }}
          PREVIEW_URL: ${{ steps.pullpreview.outputs.url }}
          SKIP_XWIKI: ${{ steps.resolve_setup_method.outputs.skip_xwiki }}
          SKIP_GITLAB: ${{ steps.resolve_setup_method.outputs.skip_gitlab }}
        run: .github/scripts/deploy-preview-summary.sh

      - name: Preview endpoint checks
        uses: ./.github/actions/preview-endpoint-checks
        if: steps.pullpreview.outputs.live == 'true'
        with:
          preview-url: ${{ steps.pullpreview.outputs.url }}
          skip-xwiki: ${{ steps.resolve_setup_method.outputs.skip_xwiki }}
          skip-gitlab: ${{ steps.resolve_setup_method.outputs.skip_gitlab }}
