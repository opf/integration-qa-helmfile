name: PullPreview

on:
# schedule:
#   - cron: "30 */6 * * *"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pullpreview-${{ github.repository }}-${{ github.event.pull_request.number || 'schedule' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'schedule' || github.event.label.name == 'pullpreview' || contains(github.event.pull_request.labels.*.name, 'pullpreview')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: auth_label_change
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          action="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"
          label="$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")"
          has_pullpreview="$(jq -r '[.pull_request.labels[]?.name] | index("pullpreview") != null' "$GITHUB_EVENT_PATH")"

          auth_label_changed=false
          if [[ "$has_pullpreview" == "true" && ( "$action" == "labeled" || "$action" == "unlabeled" ) ]]; then
            case "$label" in
              auth-sso-external|auth-sso-nextcloud|auth-oauth2)
                auth_label_changed=true
                ;;
            esac
          fi

          {
            echo "changed=${auth_label_changed}"
            if [[ "$auth_label_changed" == "true" ]]; then
              echo "force_action=up"
            else
              echo "force_action="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Resolve setup method
        id: resolve_setup_method
        shell: bash
        run: |
          set -euo pipefail
          # Default to sso-external; schedule runs always use this default.
          setup_method="sso-external"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            labels="$(jq -r '[.pull_request.labels[]?.name] | join(" ")' "$GITHUB_EVENT_PATH")"
            for label in $labels; do
              case "$label" in
                auth-sso-nextcloud) setup_method="sso-nextcloud"; break ;;
                auth-oauth2)        setup_method="oauth2";        break ;;
                auth-sso-external)  setup_method="sso-external";  break ;;
              esac
            done
          fi
          echo "method=${setup_method}" >> "$GITHUB_OUTPUT"
          echo "::notice::PullPreview setup method: ${setup_method}"

      - name: Resolve enterprise token
        id: enterprise_token
        env:
          ENTERPRISE_TOKEN_TIER: corporate
          TOKEN_CORPORATE: ${{ secrets.OPENPROJECT_ENTERPRISE_TOKEN }}
        run: .github/scripts/resolve-enterprise-token.sh

      - name: Recreate preview before auth-mode change
        if: steps.auth_label_change.outputs.changed == 'true'
        uses: pullpreview/action@65df5209b58f360444525f1167f9e14803521fed
        with:
          provider: hetzner
          label: pullpreview
          force_action: down
          deployment_target: helm
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_CA_KEY: ${{ secrets.HETZNER_CA_KEY }}
          PULLPREVIEW_LOGGER_LEVEL: ERROR

      - id: pullpreview
        uses: pullpreview/action@65df5209b58f360444525f1167f9e14803521fed
        with:
          provider: hetzner
          label: pullpreview
          force_action: ${{ steps.auth_label_change.outputs.force_action }}
          region: fsn1
          image: ubuntu-24.04
          instance_type: cpx42
          dns: my.opf.run
          max_domain_length: "40"
          deployment_target: helm
          chart: ./charts/pullpreview-stack
          chart_values: pullpreview/stack-values.yaml.gotmpl
          pre_script: pullpreview/pre-script-helm-deps.sh
          proxy_tls: traefik:80
          proxy_tls_hosts: nextcloud.{{ pullpreview_public_dns }},keycloak.{{ pullpreview_public_dns }},xwiki.{{ pullpreview_public_dns }}
          ttl: 72h
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_CA_KEY: ${{ secrets.HETZNER_CA_KEY }}
          OPENPROJECT_ENTERPRISE_TOKEN: ${{ steps.enterprise_token.outputs.token }}
          INTEGRATION_SETUP_METHOD: ${{ steps.resolve_setup_method.outputs.method }}
          PULLPREVIEW_LOGGER_LEVEL: INFO

      - name: Strip SSH lines from PullPreview summary
        if: always() && steps.pullpreview.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || exit 0
          [[ -f "${GITHUB_STEP_SUMMARY}" ]] || exit 0
          sed -i -E '/^- SSH (Username|IP|Command):/d' "${GITHUB_STEP_SUMMARY}"

      - name: Deploy preview summary
        if: always() && steps.pullpreview.outcome != 'skipped'
        env:
          PREVIEW_NAME: pullpreview
          PULLPREVIEW_OUTCOME: ${{ steps.pullpreview.outcome }}
          PULLPREVIEW_LIVE: ${{ steps.pullpreview.outputs.live }}
          PREVIEW_URL: ${{ steps.pullpreview.outputs.url }}
        run: .github/scripts/deploy-preview-summary.sh

      - name: Preview endpoint checks
        uses: ./.github/actions/preview-endpoint-checks
        if: steps.pullpreview.outputs.live == 'true'
        with:
          preview-url: ${{ steps.pullpreview.outputs.url }}
