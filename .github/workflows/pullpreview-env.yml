name: PullPreview Environment
run-name: >-
  ${{
    format(
      'PullPreview env · {0}{1} · {2} · {3} · {4} · {5} · {6}',
      github.event.inputs.openproject_standalone == 'true' && 'standalone ' || '',
      github.event.inputs.setup_method,
      format(
        'OP {0}{1}',
        github.event.inputs.openproject_version != '' && github.event.inputs.openproject_version || '17',
        github.event.inputs.openproject_branch != '' && format(' ({0})', github.event.inputs.openproject_branch) || ''
      ),
      github.event.inputs.openproject_standalone == 'true'
        && 'NC off'
        || format(
          'NC {0}{1}',
          github.event.inputs.nextcloud_version != '' && github.event.inputs.nextcloud_version || '34',
          github.event.inputs.nextcloud_branch != '' && format(' ({0})', github.event.inputs.nextcloud_branch) || ''
        ),
      github.event.inputs.openproject_standalone == 'true'
        && 'app n/a'
        || (github.event.inputs.integration_app_branch != '' && format('app ({0})', github.event.inputs.integration_app_branch) || (github.event.inputs.integration_app_version != '' && format('app {0}', github.event.inputs.integration_app_version) || 'app default')),
      github.event.inputs.xwiki_enabled == 'true'
        && format(
          'XWiki {0} + ext {1}',
          github.event.inputs.xwiki_version != '' && github.event.inputs.xwiki_version || '17.10.10',
          github.event.inputs.xwiki_extension_version != '' && github.event.inputs.xwiki_extension_version || '1.2.0'
        )
        || 'XWiki off',
      github.event.inputs.gitlab_enabled == 'true'
        && format(
          'GitLab {0}',
          github.event.inputs.gitlab_version != '' && github.event.inputs.gitlab_version || 'v19.4.1'
        )
        || 'GitLab off'
    )
  }}

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      setup_method:
        description: "[Stack] Integration setup mode"
        required: true
        default: sso-external
        type: choice
        options:
          - sso-external
          - sso-nextcloud
          - oauth2
      openproject_standalone:
        description: "[Stack] OpenProject standalone (no Nextcloud; Keycloak only with sso-external)"
        required: false
        default: false
        type: boolean
      enterprise_token_tier:
        description: "[Stack] OpenProject enterprise plan (integration stack requires corporate)"
        required: true
        default: corporate
        type: choice
        options:
          - corporate
      openproject_version:
        description: "[OpenProject] Image tag (empty = 17)"
        required: false
        type: string
      openproject_branch:
        description: "[OpenProject] Optional git source branch"
        required: false
        type: string
      openproject_wiki_enhancements:
        description: "[OpenProject] Enable wiki_enhancements feature flag (XWiki)"
        required: false
        default: true
        type: boolean
      nextcloud_version:
        description: "[Nextcloud] Image tag (empty = 34; ignored when standalone)"
        required: false
        type: string
      nextcloud_branch:
        description: "[Nextcloud] Optional git source branch (ignored when standalone)"
        required: false
        type: string
      integration_app_version:
        description: "[Integration app] Version (ignored when standalone)"
        required: false
        type: string
      integration_app_branch:
        description: "[Integration app] Git branch override (ignored when standalone)"
        required: false
        type: string
      xwiki_enabled:
        description: "[XWiki] Deploy XWiki (versions below ignored when unchecked)"
        required: false
        default: false
        type: boolean
      xwiki_version:
        description: "[XWiki] Image tag (used only when XWiki is checked)"
        required: false
        default: "17.10.10"
        type: string
      xwiki_extension_version:
        description: "[XWiki] OpenProject extension version (used only when XWiki is checked)"
        required: false
        default: "1.2.0"
        type: string
      gitlab_enabled:
        description: "[GitLab] Deploy GitLab (version below ignored when unchecked)"
        required: false
        default: false
        type: boolean
      gitlab_version:
        description: "[GitLab] Image tag (used only when GitLab is checked)"
        required: false
        default: "v19.4.1"
        type: string

permissions:
  contents: read

jobs:
  resolve_deploy_inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      openproject_version: ${{ steps.validate.outputs.openproject_version }}
      openproject_branch: ${{ steps.validate.outputs.openproject_branch }}
      nextcloud_version: ${{ steps.validate.outputs.nextcloud_version }}
      nextcloud_branch: ${{ steps.validate.outputs.nextcloud_branch }}
      integration_openproject_version: ${{ steps.validate.outputs.integration_openproject_version }}
      integration_openproject_branch: ${{ steps.validate.outputs.integration_openproject_branch }}
      effective_xwiki_version: ${{ steps.validate.outputs.effective_xwiki_version }}
      effective_xwiki_extension_version: ${{ steps.validate.outputs.effective_xwiki_extension_version }}
      effective_gitlab_version: ${{ steps.validate.outputs.effective_gitlab_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate stack topology
        env:
          IN_SETUP: ${{ github.event.inputs.setup_method }}
          IN_STANDALONE: ${{ github.event.inputs.openproject_standalone }}
          IN_XWIKI_ENABLED: ${{ github.event.inputs.xwiki_enabled }}
          IN_GITLAB_ENABLED: ${{ github.event.inputs.gitlab_enabled }}
        run: .github/scripts/resolve-stack-topology.sh "" "${IN_SETUP}" >/dev/null

      - name: Validate and resolve deploy inputs
        id: validate
        env:
          IN_OP_VER: ${{ github.event.inputs.openproject_version }}
          IN_NC_VER: ${{ github.event.inputs.nextcloud_version }}
          IN_XWIKI_ENABLED: ${{ github.event.inputs.xwiki_enabled }}
          IN_XWIKI_VER: ${{ github.event.inputs.xwiki_version }}
          IN_IO_VER: ${{ github.event.inputs.integration_app_version }}
          IN_XWIKI_EXT: ${{ github.event.inputs.xwiki_extension_version }}
          IN_GITLAB_ENABLED: ${{ github.event.inputs.gitlab_enabled }}
          IN_GITLAB_VER: ${{ github.event.inputs.gitlab_version }}
          IN_OP_BRANCH: ${{ github.event.inputs.openproject_branch }}
          IN_NC_BRANCH: ${{ github.event.inputs.nextcloud_branch }}
          IN_IO_BRANCH: ${{ github.event.inputs.integration_app_branch }}
          IN_NEXTCLOUD_ENABLED: ${{ github.event.inputs.openproject_standalone != 'true' && 'true' || 'false' }}
        run: .github/scripts/validate-deploy-inputs.sh

  deploy:
    needs: [resolve_deploy_inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true
      HEADLESS: true
      SKIP_SETUP_JOB_CHECK: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HETZNER_CA_KEY: ${{ secrets.HETZNER_CA_KEY }}
    outputs:
      live: ${{ steps.publish.outputs.live }}
      preview_name: ${{ steps.publish.outputs.preview_name }}
      openproject_host: ${{ steps.publish.outputs.openproject_host }}
      openproject_url: ${{ steps.publish.outputs.openproject_url }}
      nextcloud_host: ${{ steps.publish.outputs.nextcloud_host }}
      keycloak_host: ${{ steps.publish.outputs.keycloak_host }}
      xwiki_host: ${{ steps.publish.outputs.xwiki_host }}
      gitlab_host: ${{ steps.publish.outputs.gitlab_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve enterprise token
        id: enterprise_token
        env:
          ENTERPRISE_TOKEN_TIER: ${{ github.event.inputs.enterprise_token_tier }}
          TOKEN_CORPORATE: ${{ secrets.OPENPROJECT_ENTERPRISE_TOKEN }}
        run: .github/scripts/resolve-enterprise-token.sh

      - name: Record run start time (Europe/Berlin)
        env:
          IN_TIER: ${{ github.event.inputs.enterprise_token_tier }}
        run: |
          set -euo pipefail
          ts="$(TZ=Europe/Berlin date '+%d %b %Y %H:%M:%S')"
          {
            echo "### PullPreview Environment"
            echo ""
            echo "**Started (Europe/Berlin):** ${ts}"
            echo "**Enterprise token tier:** ${IN_TIER:-corporate}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::PullPreview Environment deploy started (Europe/Berlin): ${ts}"

      - name: Resolve topology and preview name
        id: resolve
        env:
          IN_SETUP: ${{ github.event.inputs.setup_method }}
          IN_STANDALONE: ${{ github.event.inputs.openproject_standalone }}
          IN_XWIKI_ENABLED: ${{ github.event.inputs.xwiki_enabled }}
          IN_GITLAB_ENABLED: ${{ github.event.inputs.gitlab_enabled }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SECRET_HCLOUD: ${{ secrets.HCLOUD_TOKEN }}
          SECRET_HETZNER_CA: ${{ secrets.HETZNER_CA_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SECRET_HCLOUD:-}" ]]; then
            echo "::error::Secret HCLOUD_TOKEN is not set or empty."
            exit 1
          fi
          if [[ -z "${SECRET_HETZNER_CA:-}" ]]; then
            echo "::error::Secret HETZNER_CA_KEY is not set or empty."
            exit 1
          fi

          preview_name="env-${RUN_ID}-${RUN_ATTEMPT}"
          {
            .github/scripts/resolve-stack-topology.sh "" "${IN_SETUP}"
            echo "preview_name=${preview_name}"
          } >> "$GITHUB_OUTPUT"

      - name: PullPreview up
        id: pullpreview_up
        if: success()
        uses: pullpreview/action@7ef9914ea29854d3e9cd60a0cec35ce3f060855a # v6.2.1
        with:
          provider: hetzner
          label: ${{ steps.resolve.outputs.preview_name }}
          force_action: up
          region: fsn1
          image: ubuntu-24.04
          instance_type: cpx42
          dns: my.opf.run
          max_domain_length: "40"
          deployment_target: helm
          chart: ./charts/pullpreview-stack
          chart_values: pullpreview/stack-values.yaml.gotmpl
          pre_script: pullpreview/pre-script-helm-deps-e2e.sh
          proxy_tls: traefik:80
          proxy_tls_hosts: ${{ steps.resolve.outputs.proxy_tls_hosts }}
          ttl: 72h
        env:
          PULLPREVIEW_LOGGER_LEVEL: INFO
          OPENPROJECT_ENTERPRISE_TOKEN: ${{ steps.enterprise_token.outputs.token }}
          INTEGRATION_SETUP_METHOD: ${{ github.event.inputs.setup_method }}
          OPENPROJECT_VERSION: ${{ github.event.inputs.openproject_version }}
          OPENPROJECT_BRANCH: ${{ github.event.inputs.openproject_branch }}
          NEXTCLOUD_VERSION: ${{ github.event.inputs.nextcloud_version }}
          NEXTCLOUD_BRANCH: ${{ github.event.inputs.nextcloud_branch }}
          INTEGRATION_OPENPROJECT_VERSION: ${{ needs.resolve_deploy_inputs.outputs.integration_openproject_version }}
          INTEGRATION_OPENPROJECT_GIT_BRANCH: ${{ needs.resolve_deploy_inputs.outputs.integration_openproject_branch }}
          XWIKI_VERSION: ${{ needs.resolve_deploy_inputs.outputs.effective_xwiki_version }}
          XWIKI_EXTENSION_OPENPROJECT_VERSION: ${{ needs.resolve_deploy_inputs.outputs.effective_xwiki_extension_version }}
          OPENPROJECT_FEATURE_WIKI_ENHANCEMENTS: ${{ github.event.inputs.openproject_wiki_enhancements }}
          XWIKI_ENABLED: ${{ steps.resolve.outputs.xwiki_enabled }}
          GITLAB_ENABLED: ${{ steps.resolve.outputs.gitlab_enabled }}
          GITLAB_VERSION: ${{ needs.resolve_deploy_inputs.outputs.effective_gitlab_version }}
          STACK_PROFILE: ${{ steps.resolve.outputs.stack_profile }}

      - name: Deploy preview summary
        if: always() && steps.pullpreview_up.outcome != 'skipped'
        env:
          PREVIEW_NAME: ${{ steps.resolve.outputs.preview_name }}
          PULLPREVIEW_OUTCOME: ${{ steps.pullpreview_up.outcome }}
          PULLPREVIEW_LIVE: ${{ steps.pullpreview_up.outputs.live }}
          PREVIEW_URL: ${{ steps.pullpreview_up.outputs.url }}
          SKIP_NEXTCLOUD: ${{ steps.resolve.outputs.skip_nextcloud }}
          SKIP_XWIKI: ${{ steps.resolve.outputs.skip_xwiki }}
          SKIP_KEYCLOAK: ${{ steps.resolve.outputs.skip_keycloak }}
          SKIP_GITLAB: ${{ steps.resolve.outputs.skip_gitlab }}
        run: .github/scripts/deploy-preview-summary.sh

      - name: Preview endpoint checks
        id: validate_urls
        uses: ./.github/actions/preview-endpoint-checks
        if: success() && steps.pullpreview_up.outputs.live == 'true'
        continue-on-error: true
        with:
          preview-url: ${{ steps.pullpreview_up.outputs.url }}
          skip-xwiki: ${{ steps.resolve.outputs.skip_xwiki }}
          skip-nextcloud: ${{ steps.resolve.outputs.skip_nextcloud }}
          skip-keycloak: ${{ steps.resolve.outputs.skip_keycloak }}
          skip-gitlab: ${{ steps.resolve.outputs.skip_gitlab }}

      - name: Export hosts
        id: export_hosts
        if: always() && steps.pullpreview_up.outputs.live == 'true'
        env:
          PREVIEW_URL: ${{ steps.pullpreview_up.outputs.url }}
          PREVIEW_NAME: ${{ steps.resolve.outputs.preview_name }}
          SKIP_NEXTCLOUD: ${{ steps.resolve.outputs.skip_nextcloud }}
          SKIP_XWIKI: ${{ steps.resolve.outputs.skip_xwiki }}
          SKIP_KEYCLOAK: ${{ steps.resolve.outputs.skip_keycloak }}
          SKIP_GITLAB: ${{ steps.resolve.outputs.skip_gitlab }}
        run: |
          set -euo pipefail
          preview_url="${PREVIEW_URL}"
          preview_host="$(.github/scripts/preview-parse-host.sh)"

          if [[ "${preview_url}" == *:443 ]]; then
            preview_url="${preview_url%:443}"
          fi

          {
            echo "OPENPROJECT_HOST=${preview_host}"
            echo "OPENPROJECT_URL=${preview_url}"
          } >> "$GITHUB_ENV"
          if [[ "${SKIP_NEXTCLOUD:-false}" != "true" ]]; then
            echo "NEXTCLOUD_HOST=nextcloud.${preview_host}" >> "$GITHUB_ENV"
          fi
          if [[ "${SKIP_KEYCLOAK:-false}" != "true" ]]; then
            echo "KEYCLOAK_HOST=keycloak.${preview_host}" >> "$GITHUB_ENV"
          fi
          if [[ "${SKIP_XWIKI:-false}" != "true" ]]; then
            echo "XWIKI_HOST=xwiki.${preview_host}" >> "$GITHUB_ENV"
          fi
          if [[ "${SKIP_GITLAB:-false}" != "true" ]]; then
            echo "GITLAB_HOST=gitlab.${preview_host}" >> "$GITHUB_ENV"
          fi

          {
            echo "### PullPreview endpoints"
            echo ""
            echo "- Preview name: \`${PREVIEW_NAME}\`"
            echo "- OpenProject: ${preview_url}"
            if [[ "${SKIP_NEXTCLOUD:-false}" != "true" ]]; then
              echo "- Nextcloud: https://nextcloud.${preview_host}"
            fi
            if [[ "${SKIP_KEYCLOAK:-false}" != "true" ]]; then
              echo "- Keycloak: https://keycloak.${preview_host}"
            fi
            if [[ "${SKIP_XWIKI:-false}" != "true" ]]; then
              echo "- XWiki: https://xwiki.${preview_host}"
            fi
            if [[ "${SKIP_GITLAB:-false}" != "true" ]]; then
              echo "- GitLab: https://gitlab.${preview_host}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deploy outputs
        id: publish
        if: always()
        env:
          LIVE: ${{ steps.pullpreview_up.outputs.live }}
          PREVIEW_NAME: ${{ steps.resolve.outputs.preview_name }}
        run: |
          set -euo pipefail
          {
            echo "live=${LIVE:-}"
            echo "preview_name=${PREVIEW_NAME}"
            echo "openproject_host=${OPENPROJECT_HOST:-}"
            echo "openproject_url=${OPENPROJECT_URL:-}"
            echo "nextcloud_host=${NEXTCLOUD_HOST:-}"
            echo "keycloak_host=${KEYCLOAK_HOST:-}"
            echo "xwiki_host=${XWIKI_HOST:-}"
            echo "gitlab_host=${GITLAB_HOST:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Environment kept notice
        if: >-
          always() &&
          steps.publish.outputs.live == 'true' &&
          steps.publish.outputs.preview_name != ''
        env:
          PREVIEW_NAME: ${{ steps.publish.outputs.preview_name }}
          OPENPROJECT_URL: ${{ steps.publish.outputs.openproject_url }}
          NEXTCLOUD_HOST: ${{ steps.publish.outputs.nextcloud_host }}
          KEYCLOAK_HOST: ${{ steps.publish.outputs.keycloak_host }}
          XWIKI_HOST: ${{ steps.publish.outputs.xwiki_host }}
          GITLAB_HOST: ${{ steps.publish.outputs.gitlab_host }}
        run: |
          set -euo pipefail
          {
            echo "### PullPreview environment kept"
            echo ""
            echo "Deploy-only environment (no E2E / MCP tests). TTL 72h."
            echo ""
            echo "- Preview label: \`${PREVIEW_NAME}\`"
            if [[ -n "${OPENPROJECT_URL}" ]]; then
              echo "- OpenProject: ${OPENPROJECT_URL}"
            fi
            if [[ -n "${NEXTCLOUD_HOST}" ]]; then
              echo "- Nextcloud: https://${NEXTCLOUD_HOST}"
            fi
            if [[ -n "${KEYCLOAK_HOST}" ]]; then
              echo "- Keycloak: https://${KEYCLOAK_HOST}"
            fi
            if [[ -n "${XWIKI_HOST}" ]]; then
              echo "- XWiki: https://${XWIKI_HOST}"
            fi
            if [[ -n "${GITLAB_HOST}" ]]; then
              echo "- GitLab: https://${GITLAB_HOST}"
            fi
            echo ""
            echo "To tear down later, run workflow **PullPreview Cleanup**:"
            echo "- \`target=env\`"
            echo "- \`mode=teardown\`"
            echo "- \`confirm_teardown=true\`"
            echo "- Preview label: \`${PREVIEW_NAME}\`"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::PullPreview Environment is live. Tear down via **PullPreview Cleanup** (target=env)."

      - name: Tear down failed preview
        if: >-
          always() &&
          steps.publish.outputs.preview_name != '' &&
          steps.publish.outputs.live != 'true'
        uses: pullpreview/action@7ef9914ea29854d3e9cd60a0cec35ce3f060855a # v6.2.1
        with:
          provider: hetzner
          label: ${{ steps.publish.outputs.preview_name }}
          force_action: down
          deployment_target: helm
        env:
          PULLPREVIEW_LOGGER_LEVEL: ERROR

      - name: Final status
        if: always()
        env:
          LIVE: ${{ steps.publish.outputs.live }}
          PREVIEW_NAME: ${{ steps.publish.outputs.preview_name }}
          VALIDATE_OUTCOME: ${{ steps.validate_urls.outcome }}
        run: |
          set -euo pipefail
          if [[ "${LIVE}" == "true" ]]; then
            if [[ "${VALIDATE_OUTCOME}" != "success" ]]; then
              echo "::warning::Preview is live but endpoint checks did not pass (${VALIDATE_OUTCOME:-skipped}); some services may still be starting."
            fi
            echo "::notice::PullPreview Environment is live (${PREVIEW_NAME}). Tear down via **PullPreview Cleanup** (target=env)."
            exit 0
          fi
          echo "::error::PullPreview Environment did not become live. See deploy logs."
          exit 1
