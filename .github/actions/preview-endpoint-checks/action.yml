name: Preview endpoint checks
description: Verify OpenProject, Nextcloud, Keycloak, and XWiki HTTPS endpoints on a live PullPreview deployment.

inputs:
  preview-url:
    description: PullPreview deployment URL (e.g. https://example.my.opf.run)
    required: true
  skip-xwiki:
    description: Skip XWiki endpoint checks (set true when XWiki is not deployed)
    required: false
    default: 'false'
  skip-nextcloud:
    description: Skip Nextcloud endpoint checks (set true when Nextcloud is not deployed)
    required: false
    default: 'false'
  skip-keycloak:
    description: Skip Keycloak endpoint checks (set true when Keycloak is not deployed)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve preview host for checks
      id: preview_host
      shell: bash
      env:
        PREVIEW_URL: ${{ inputs.preview-url }}
      run: |
        set -euo pipefail
        host="$("${GITHUB_WORKSPACE}/.github/scripts/preview-parse-host.sh")"
        echo "host=${host}" >> "$GITHUB_OUTPUT"
        {
          echo "### Endpoint checks"
          echo ""
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Check OpenProject
      id: check_openproject
      shell: bash
      continue-on-error: true
      env:
        PREVIEW_HOST: ${{ steps.preview_host.outputs.host }}
      run: |
        set -euo pipefail
        failed=false
        set +e
        "${GITHUB_WORKSPACE}/.github/scripts/preview-check-url.sh" "OpenProject (root)" "https://${PREVIEW_HOST}/" "302" || failed=true
        "${GITHUB_WORKSPACE}/.github/scripts/preview-check-url.sh" "OpenProject (login)" "https://${PREVIEW_HOST}/login" "200" || failed=true
        set -e
        [[ "${failed}" != "true" ]]

    - name: Check Nextcloud
      id: check_nextcloud
      if: inputs.skip-nextcloud != 'true'
      shell: bash
      continue-on-error: true
      env:
        PREVIEW_HOST: ${{ steps.preview_host.outputs.host }}
      run: |
        set -euo pipefail
        "${GITHUB_WORKSPACE}/.github/scripts/preview-check-url.sh" "Nextcloud" "https://nextcloud.${PREVIEW_HOST}/status.php" "200" 60 10

    - name: Check Keycloak
      id: check_keycloak
      if: inputs.skip-keycloak != 'true'
      shell: bash
      continue-on-error: true
      env:
        PREVIEW_HOST: ${{ steps.preview_host.outputs.host }}
      run: |
        set -euo pipefail
        "${GITHUB_WORKSPACE}/.github/scripts/preview-check-url.sh" "Keycloak" "https://keycloak.${PREVIEW_HOST}/realms/opnc" "200"

    - name: Check XWiki
      id: check_xwiki
      if: inputs.skip-xwiki != 'true'
      shell: bash
      continue-on-error: true
      env:
        PREVIEW_HOST: ${{ steps.preview_host.outputs.host }}
      run: |
        set -euo pipefail
        # XWiki does first-time setup and extension installs; follow redirects once setup completes.
        "${GITHUB_WORKSPACE}/.github/scripts/preview-check-url.sh" "XWiki" "https://xwiki.${PREVIEW_HOST}/bin/distribution/XWiki/Distribution" "200" 120 10 true

    - name: Check XWiki metadata
      id: check_xwiki_metadata
      if: inputs.skip-xwiki != 'true'
      shell: bash
      continue-on-error: true
      env:
        PREVIEW_HOST: ${{ steps.preview_host.outputs.host }}
      run: |
        set -euo pipefail
        "${GITHUB_WORKSPACE}/.github/scripts/preview-check-url.sh" "XWiki metadata" "https://xwiki.${PREVIEW_HOST}/rest/openproject/metadata" "200" 120 10

    - name: Require all endpoint checks
      shell: bash
      env:
        CHECK_OP: ${{ steps.check_openproject.outcome }}
        CHECK_NC: ${{ steps.check_nextcloud.outcome }}
        CHECK_KC: ${{ steps.check_keycloak.outcome }}
        CHECK_XW: ${{ steps.check_xwiki.outcome }}
        CHECK_XW_META: ${{ steps.check_xwiki_metadata.outcome }}
        SKIP_XWIKI: ${{ inputs.skip-xwiki }}
        SKIP_NEXTCLOUD: ${{ inputs.skip-nextcloud }}
        SKIP_KEYCLOAK: ${{ inputs.skip-keycloak }}
      run: |
        set -euo pipefail
        entries=("OpenProject:${CHECK_OP}")
        if [[ "${SKIP_NEXTCLOUD}" != "true" ]]; then
          entries+=("Nextcloud:${CHECK_NC}")
        fi
        if [[ "${SKIP_KEYCLOAK}" != "true" ]]; then
          entries+=("Keycloak:${CHECK_KC}")
        fi
        if [[ "${SKIP_XWIKI}" != "true" ]]; then
          entries+=("XWiki:${CHECK_XW}" "XWiki metadata:${CHECK_XW_META}")
        fi
        failed=false
        for entry in "${entries[@]}"; do
          name="${entry%%:*}"
          outcome="${entry#*:}"
          if [[ "${outcome}" == "failure" ]]; then
            echo "::error::${name} endpoint check failed"
            failed=true
          elif [[ "${outcome}" == "skipped" ]]; then
            echo "::error::${name} endpoint check was skipped"
            failed=true
          fi
        done
        if [[ "${failed}" == "true" ]]; then
          exit 1
        fi
