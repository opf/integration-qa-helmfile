# mcp-eval configuration for OpenProject MCP server
# Resolve LLM_* via .github/scripts/resolve-llm-provider.sh (or export manually).
model:
  provider: openai
  name: ${LLM_MODEL:-Llama-3.3-70b-instruct}
  api_base: ${LLM_BASE_URL:-https://llm-stack.openproject-edge.eu/v1}
  api_key: ${LLM_API_KEY}
  temperature: 0.1
  max_tokens: 1024

servers:
  openproject:
    url: ${OPENPROJECT_URL:-https://openproject.test}/mcp/
    transport: streamable-http
    headers:
      Authorization: "Bearer ${MCP_BEARER_TOKEN}"
      Content-Type: "application/json"

reporting:
  formats: ["json", "markdown", "html"]
  output_dir: "./reports"
  include_traces: true
