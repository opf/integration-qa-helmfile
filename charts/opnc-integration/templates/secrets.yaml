{{- if include "opnc.renderBootstrapResources" . }}
{{- $adminPassword := .Values.adminPassword | default "admin" }}
{{- $userPassword := .Values.userPassword | default "1234" }}
{{- $mcp := .Values.mcp | default (dict "enabled" true) }}
{{- $mcpToken := $mcp.oauthToken | default "" }}
{{- if not $mcpToken }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "opnc-secrets") | default dict }}
{{- $existingData := index $existing "data" | default dict }}
{{- if hasKey $existingData "mcp-oauth-token" }}
{{- $mcpToken = index $existingData "mcp-oauth-token" | b64dec }}
{{- else }}
{{- $mcpToken = randAlphaNum 40 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: opnc-secrets
type: Opaque
stringData:
  admin-password: {{ $adminPassword | quote }}
  realm-user-password: {{ $userPassword | quote }}
  mcp-oauth-token: {{ $mcpToken | quote }}
  oidc-openproject-client-secret: {{ include "opnc.oidc.openprojectClientSecret" . | quote }}
  oidc-nextcloud-client-secret: {{ include "opnc.oidc.nextcloudClientSecret" . | quote }}
  xwiki-oauth-client-secret: {{ index .Values.openproject.xwiki "clientSecret" | default "xwiki-client-secret" | quote }}
{{- end }}
