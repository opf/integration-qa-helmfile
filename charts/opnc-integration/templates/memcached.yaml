{{- if include "opnc.renderBootstrapResources" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: openproject-memcached
  labels:
    app.kubernetes.io/name: openproject-memcached
spec:
  type: ClusterIP
  ports:
    - name: memcache
      port: 11211
      targetPort: memcache
      protocol: TCP
  selector:
    app.kubernetes.io/name: openproject-memcached
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-memcached
  labels:
    app.kubernetes.io/name: openproject-memcached
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject-memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject-memcached
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 11211
        runAsGroup: 11211
        fsGroup: 11211
        supplementalGroups: []
        supplementalGroupsPolicy: Strict
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memcached
          image: memcached:1.6-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 11211
            runAsGroup: 11211
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: memcache
              containerPort: 11211
              protocol: TCP
          args:
            - -m
            - "64"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
{{- end }}
