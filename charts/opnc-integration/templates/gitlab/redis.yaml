{{- if include "opnc.renderBootstrapResources" . }}
{{- if .Values.gitlab.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-redis-master
  labels:
    app.kubernetes.io/name: gitlab-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: gitlab-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab-redis
  labels:
    app.kubernetes.io/name: gitlab-redis
spec:
  serviceName: gitlab-redis-master
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        supplementalGroups: []
        supplementalGroupsPolicy: Strict
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          command:
            - sh
            - -c
            - redis-server --bind 0.0.0.0 --protected-mode yes --requirepass "$REDIS_PASSWORD" --dir /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-redis-password
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: 4Gi
{{- end }}
{{- end }}