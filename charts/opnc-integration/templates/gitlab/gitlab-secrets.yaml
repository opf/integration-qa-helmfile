{{- if include "opnc.renderBootstrapResources" . }}
{{- if .Values.gitlab.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-root-password
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ .Values.gitlab.initialRootPassword | default (.Values.adminPassword | default "admin") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis-password
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ .Values.gitlab.redis.password | quote }}
{{- end }}
{{- end }}
