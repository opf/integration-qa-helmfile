{{- $secretName := .Values.fullnameOverride -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $dbPassword := randAlphaNum 32 -}}
{{- $jwtSecret := randBytes 64 | b64enc -}}
{{- $cryptoSecret := randAlphaNum 64 -}}
{{- if $existing -}}
  {{- if index $existing.data "db-password" -}}
    {{- $dbPassword = index $existing.data "db-password" | b64dec -}}
  {{- end -}}
  {{- if index $existing.data "jwt-secret" -}}
    {{- $jwtSecret = index $existing.data "jwt-secret" | b64dec -}}
  {{- end -}}
  {{- if index $existing.data "crypto-secret" -}}
    {{- $cryptoSecret = index $existing.data "crypto-secret" | b64dec -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: squashtm
  annotations:
    # Keep generated secrets across helm upgrades (same pattern as OpenProject secret-key-base).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  db-password: {{ $dbPassword | quote }}
  # Squash: Base64 string whose decoded form is >=512 bits (64 bytes -> 88 chars).
  jwt-secret: {{ $jwtSecret | quote }}
  crypto-secret: {{ $cryptoSecret | quote }}
  {{- if .Values.adminPassword }}
  admin-password: {{ .Values.adminPassword | quote }}
  {{- end }}
