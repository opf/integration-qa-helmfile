apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride | quote }}
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
